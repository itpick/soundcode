<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound to Code</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f9;
    --bg-card: #ffffff;
    --fg: #1a1a1e;
    --muted: #55565f;
    --border: #dcdce2;
    --accent: #3d5af1;
    --accent-2: #7b3df1;
    --bar-track: #e7e7ee;
    --bar-wav: #b8bccb;
    --bar-mp3: #7b8ad1;
    --bar-sc: #3d5af1;
    --bar-scgz: #7b3df1;
    --chip-bg: #eef0fb;
    --chip-fg: #33366b;
    --warn-bg: #fff2ea;
    --warn-fg: #7a3b12;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101116;
      --bg-card: #181a22;
      --fg: #edeef2;
      --muted: #a3a5b3;
      --border: #2c2e3a;
      --accent: #7f96ff;
      --accent-2: #c39bff;
      --bar-track: #23252f;
      --bar-wav: #40424f;
      --bar-mp3: #57619e;
      --bar-sc: #7f96ff;
      --bar-scgz: #c39bff;
      --chip-bg: #1f2233;
      --chip-fg: #c3c8ff;
      --warn-bg: #2c2013;
      --warn-fg: #f0b585;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 16px;
  }
  header.hero {
    padding: 40px 0 28px;
    border-bottom: 1px solid var(--border);
  }
  header.hero h1 {
    margin: 0 0 8px;
    font-size: 1.8rem;
  }
  header.hero p.tagline {
    margin: 0 0 20px;
    color: var(--muted);
    max-width: 60ch;
  }
  .totals {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 28px;
  }
  .totals .stat {
    display: flex;
    flex-direction: column;
  }
  .totals .stat .n {
    font-size: 1.4rem;
    font-weight: 600;
  }
  .totals .stat .l {
    font-size: 0.8rem;
    color: var(--muted);
  }
  #status {
    padding: 16px 0;
    color: var(--warn-fg);
    background: var(--warn-bg);
    border-radius: 8px;
    display: none;
  }
  #status.show {
    display: block;
    padding: 12px 16px;
    margin-top: 16px;
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 28px 0 48px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card h2 {
    margin: 0 0 4px;
    font-size: 1.25rem;
  }
  .card .artist {
    margin: 0 0 16px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .transport {
    margin-bottom: 18px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .transport .row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .transport button {
    font: inherit;
    font-size: 0.85rem;
    color: var(--fg);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 14px;
    cursor: pointer;
  }
  .transport button:focus-visible,
  .transport input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .transport button.play {
    min-width: 5.5em;
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg-card);
    font-weight: 600;
  }
  .transport .seek {
    flex: 1 1 200px;
    min-width: 0;
    accent-color: var(--accent);
  }
  .transport .time {
    font-variant-numeric: tabular-nums;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .transport .segmented {
    display: inline-flex;
  }
  .transport .segmented button {
    border-radius: 0;
  }
  .transport .segmented button:first-child {
    border-radius: 999px 0 0 999px;
  }
  .transport .segmented button:last-child {
    border-radius: 0 999px 999px 0;
    border-left: none;
  }
  .transport button[aria-pressed="true"] {
    background: var(--chip-bg);
    color: var(--chip-fg);
    border-color: var(--accent);
    font-weight: 600;
  }
  .transport .parts {
    margin-top: 12px;
  }
  .transport .parts .label {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .transport button.part[aria-pressed="false"] {
    color: var(--muted);
    text-decoration: line-through;
  }
  .transport button.part:disabled {
    cursor: not-allowed;
    opacity: 0.45;
    border-style: dashed;
    text-decoration: none;
  }
  .transport .msg {
    font-size: 0.8rem;
    color: var(--muted);
    min-height: 1.2em;
    margin: 8px 0 0;
  }
  .transport .files {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 6px 0 0;
  }
  .size-strip {
    margin: 18px 0;
  }
  .size-strip h3 {
    margin: 0 0 10px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .bar-row {
    display: grid;
    grid-template-columns: 90px 1fr;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 0.85rem;
  }
  .bar-row .bar-name {
    color: var(--muted);
  }
  .bar-track {
    position: relative;
    background: var(--bar-track);
    border-radius: 5px;
    height: 20px;
    overflow: hidden;
  }
  .bar-fill {
    position: absolute;
    inset: 0 auto 0 0;
    border-radius: 5px;
    height: 100%;
  }
  .bar-label {
    position: relative;
    display: block;
    padding: 0 8px;
    line-height: 20px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .borrowed {
    margin: 14px 0;
    padding: 10px 14px;
    background: var(--chip-bg);
    color: var(--chip-fg);
    border-radius: 8px;
    font-size: 0.85rem;
  }
  .singer-line {
    margin: 4px 0 14px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 4px 0 16px;
  }
  .chip {
    background: var(--chip-bg);
    color: var(--chip-fg);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 0.8rem;
  }
  details.code {
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  details.code summary {
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
  }
  details.code pre {
    margin: 12px 0;
    padding: 12px;
    background: var(--bar-track);
    border-radius: 8px;
    max-height: 320px;
    overflow: auto;
    font-size: 0.78rem;
    white-space: pre;
  }
  details.code .dl {
    font-size: 0.85rem;
  }
  a {
    color: var(--accent);
  }
  footer {
    border-top: 1px solid var(--border);
    padding: 24px 0 48px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer p {
    margin: 0 0 8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>Sound to code</h1>
    <p class="tagline">A song goes in, a text "sound code" comes out — and the song is rebuilt from that code alone. Each clip below shows the original next to the rebuild, and how small the code really is.</p>
    <div class="totals" id="totals"></div>
    <div id="status"></div>
  </header>
  <main class="cards" id="cards"></main>
  <footer id="footer"></footer>
</div>
<script>
(function () {
  "use strict";

  function el(tag, opts) {
    var e = document.createElement(tag);
    opts = opts || {};
    if (opts.text != null) e.textContent = opts.text;
    if (opts.cls) e.className = opts.cls;
    if (opts.href != null) e.setAttribute("href", opts.href);
    if (opts.attrs) {
      for (var k in opts.attrs) e.setAttribute(k, opts.attrs[k]);
    }
    return e;
  }

  function fmtKB(bytes) {
    return Math.round(bytes / 1000) + " KB";
  }

  function fmtMB(bytes) {
    return (bytes / 1e6).toFixed(1) + " MB";
  }

  function ratioOf(wav, bytes) {
    return Math.round(wav / bytes);
  }

  // ---- hero totals ----

  function buildTotals(container, totals) {
    container.textContent = "";
    var wavRatio = ratioOf(totals.wav, totals.sc);
    var gzRatio = ratioOf(totals.wav, totals.sc_gz);
    var stats = [
      ["Original WAV", fmtMB(totals.wav)],
      [".sc code", fmtKB(totals.sc) + " (×" + wavRatio + ")"],
      [".sc gzipped", fmtKB(totals.sc_gz) + " (×" + gzRatio + ")"],
    ];
    stats.forEach(function (pair) {
      var stat = el("div", { cls: "stat" });
      stat.appendChild(el("span", { cls: "n", text: pair[1] }));
      stat.appendChild(el("span", { cls: "l", text: pair[0] }));
      container.appendChild(stat);
    });
  }

  // ---- transport: every part of both sides plays in sync, one gain per part ----
  // Original ⇄ Rebuild only moves gains, so switching keeps the position.

  var audioCtx = null;
  var playingTransport = null;          // only one card plays at a time

  function fmtTime(s) {
    s = Math.max(0, Math.floor(s));
    return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
  }

  function songParts(song) {
    if (song.parts && song.parts.length) return song.parts;
    // older data.json without parts: the full mixes act as one part
    return [{ key: "mix", label: "Full mix", original: song.original, rebuild: song.rebuild }];
  }

  function buildPlayers(song) {
    var parts = songParts(song);
    var box = el("div", { cls: "transport", attrs: { role: "group", "aria-label": "Player — " + song.title } });
    var state = {
      side: "original", on: {}, buffers: null, loading: null, gains: {}, sources: [],
      playing: false, offset: 0, startedAt: 0, duration: (song.summary && song.summary.duration) || 30, raf: 0
    };
    var dragging = false;               // the user holds the seek thumb: playback must not move it
    parts.forEach(function (p) { state.on[p.key] = true; });

    // row 1: play, seek, time
    var row1 = el("div", { cls: "row" });
    var playBtn = el("button", { cls: "play", text: "Play", attrs: { type: "button", "aria-label": "Play — " + song.title } });
    var seek = el("input", {
      cls: "seek",
      attrs: { type: "range", min: "0", max: String(state.duration), step: "any", value: "0", "aria-label": "Position — " + song.title }
    });
    var time = el("span", { cls: "time", text: "0:00 / " + fmtTime(state.duration), attrs: { "aria-live": "off" } });
    row1.appendChild(playBtn);
    row1.appendChild(seek);
    row1.appendChild(time);
    box.appendChild(row1);

    // row 2: Original | Rebuild
    var row2 = el("div", { cls: "row" });
    row2.style.marginTop = "10px";
    var seg = el("div", { cls: "segmented", attrs: { role: "group", "aria-label": "Listen to" } });
    var sideBtns = {
      original: el("button", { text: "Original", attrs: { type: "button", "aria-pressed": "true" } }),
      rebuild: el("button", { text: "Rebuild", attrs: { type: "button", "aria-pressed": "false" } })
    };
    seg.appendChild(sideBtns.original);
    seg.appendChild(sideBtns.rebuild);
    row2.appendChild(seg);
    box.appendChild(row2);

    // row 3: one toggle per part
    var row3 = el("div", { cls: "row parts", attrs: { role: "group", "aria-label": "Parts" } });
    row3.appendChild(el("span", { cls: "label", text: "Parts:" }));
    var chips = {};
    parts.forEach(function (p) {
      var b = el("button", { cls: "part", text: p.label, attrs: { type: "button", "aria-pressed": "true" } });
      b.addEventListener("click", function () {
        state.on[p.key] = !state.on[p.key];
        b.setAttribute("aria-pressed", state.on[p.key] ? "true" : "false");
        applyGains();
      });
      chips[p.key] = b;
      row3.appendChild(b);
    });
    box.appendChild(row3);

    var msg = el("p", { cls: "msg", attrs: { role: "status" } });
    box.appendChild(msg);

    var files = el("p", { cls: "files" });
    files.appendChild(document.createTextNode("Full mix files: "));
    files.appendChild(el("a", { text: "original", href: song.original, attrs: { download: "" } }));
    files.appendChild(document.createTextNode(" · "));
    files.appendChild(el("a", { text: "rebuild", href: song.rebuild, attrs: { download: "" } }));
    box.appendChild(files);

    function updateChips() {
      parts.forEach(function (p) {
        var missing = p[state.side] == null;
        var b = chips[p.key];
        b.disabled = missing;
        if (missing) {
          var note = state.side === "rebuild" ? p.rebuild_note : p.original_note;
          b.title = note || (state.side === "rebuild" ? "not in the rebuild" : "not separated");
          b.setAttribute("aria-label", p.label + " — " + b.title);
        } else {
          b.removeAttribute("title");
          b.removeAttribute("aria-label");
        }
      });
    }

    function position() {
      if (!state.playing) return state.offset;
      return Math.min(state.duration, state.offset + Math.max(0, audioCtx.currentTime - state.startedAt));
    }

    function showTime(t) {
      if (dragging) return;             // the readout previews the dragged position instead
      time.textContent = fmtTime(t) + " / " + fmtTime(state.duration);
      seek.value = String(t);
    }

    function gainFor(p, side) {
      return side === state.side && state.on[p.key] ? 1 : 0;
    }

    function applyGains() {
      if (!audioCtx) return;
      parts.forEach(function (p) {
        ["original", "rebuild"].forEach(function (side) {
          var g = state.gains[p.key + "/" + side];
          if (g) g.gain.setTargetAtTime(gainFor(p, side), audioCtx.currentTime, 0.008);
        });
      });
    }

    function load() {
      if (state.buffers) return Promise.resolve(state.buffers);
      if (state.loading) return state.loading;
      msg.textContent = "Loading parts…";
      var jobs = [];
      var buffers = {};
      parts.forEach(function (p) {
        ["original", "rebuild"].forEach(function (side) {
          if (p[side] == null) return;
          jobs.push(fetch(p[side])
            .then(function (r) {
              if (!r.ok) throw new Error(p[side] + ": " + r.status);
              return r.arrayBuffer();
            })
            .then(function (ab) {
              return new Promise(function (resolve, reject) {
                audioCtx.decodeAudioData(ab, resolve, reject);   // callback form: older Safari
              });
            })
            .then(function (buf) { buffers[p.key + "/" + side] = buf; }));
        });
      });
      state.loading = Promise.all(jobs).then(function () {
        state.buffers = buffers;
        state.loading = null;
        var longest = 0;
        for (var k in buffers) longest = Math.max(longest, buffers[k].duration);
        if (longest > 0) state.duration = longest;
        seek.max = String(state.duration);
        msg.textContent = "";
        return buffers;
      }, function (err) {
        state.loading = null;
        msg.textContent = "Could not load the parts; the full mix files are below.";
        throw err;
      });
      return state.loading;
    }

    function stopSources() {
      state.sources.forEach(function (src) {
        src.onended = null;
        try { src.stop(); } catch (e) { /* already stopped */ }
        src.disconnect();
      });
      state.sources = [];
      for (var k in state.gains) state.gains[k].disconnect();
      state.gains = {};
    }

    function startAt(offset) {
      stopSources();
      var t0 = audioCtx.currentTime + 0.05;
      parts.forEach(function (p) {
        ["original", "rebuild"].forEach(function (side) {
          var buf = state.buffers[p.key + "/" + side];
          if (!buf) return;
          var g = audioCtx.createGain();
          g.gain.value = gainFor(p, side);
          g.connect(audioCtx.destination);
          state.gains[p.key + "/" + side] = g;
          if (offset >= buf.duration) return;
          var src = audioCtx.createBufferSource();
          src.buffer = buf;
          src.connect(g);
          src.start(t0, offset);
          state.sources.push(src);
        });
      });
      state.offset = offset;
      state.startedAt = t0;
      state.playing = true;
      playBtn.textContent = "Pause";
      playBtn.setAttribute("aria-label", "Pause — " + song.title);
      tick();
    }

    function tick() {
      cancelAnimationFrame(state.raf);
      if (!state.playing) return;
      var t = position();
      showTime(t);
      if (t >= state.duration) {
        pause();
        state.offset = 0;
        showTime(0);
        return;
      }
      state.raf = requestAnimationFrame(tick);
    }

    function pause() {
      if (!state.playing) return;
      state.offset = position();
      state.playing = false;
      stopSources();
      cancelAnimationFrame(state.raf);
      playBtn.textContent = "Play";
      playBtn.setAttribute("aria-label", "Play — " + song.title);
      if (playingTransport === transport) playingTransport = null;
    }

    function play() {
      if (!audioCtx) {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) { msg.textContent = "This browser has no Web Audio; use the full mix files below."; return; }
        audioCtx = new Ctx();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (playingTransport && playingTransport !== transport) playingTransport.stop();
      playingTransport = transport;
      playBtn.disabled = true;
      load().then(function () {
        playBtn.disabled = false;
        if (playingTransport !== transport) return;   // another card started while loading
        startAt(state.offset >= state.duration ? 0 : state.offset);
      }, function () {
        playBtn.disabled = false;
        if (playingTransport === transport) playingTransport = null;
      });
    }

    var transport = {
      stop: function () {
        pause();
        state.buffers = null;       // free the decoded parts; they reload on the next Play
        state.gains = {};
      }
    };

    playBtn.addEventListener("click", function () {
      if (state.playing) pause(); else play();
    });

    function seekValue() {
      return Math.min(parseFloat(seek.value) || 0, state.duration);
    }
    // while dragging, `input` only previews the time; `change` (release, or a key step) seeks
    // (release is deferred a tick so `change` still reads the user's value, not playback's)
    function release() { setTimeout(function () { dragging = false; }, 0); }
    seek.addEventListener("pointerdown", function () { dragging = true; });
    seek.addEventListener("pointerup", release);
    seek.addEventListener("pointercancel", release);
    var SEEK_KEYS = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "PageUp", "PageDown", "Home", "End"];
    seek.addEventListener("keydown", function (e) {
      if (SEEK_KEYS.indexOf(e.key) >= 0) dragging = true;   // not Tab: its keyup lands elsewhere
    });
    seek.addEventListener("keyup", release);
    seek.addEventListener("blur", function () { dragging = false; });
    seek.addEventListener("input", function () {
      time.textContent = fmtTime(seekValue()) + " / " + fmtTime(state.duration);
    });
    seek.addEventListener("change", function () {
      var t = seekValue();
      dragging = false;
      if (state.playing) startAt(t);
      else { state.offset = t; showTime(t); }
    });

    Object.keys(sideBtns).forEach(function (side) {
      sideBtns[side].addEventListener("click", function () {
        state.side = side;
        sideBtns.original.setAttribute("aria-pressed", side === "original" ? "true" : "false");
        sideBtns.rebuild.setAttribute("aria-pressed", side === "rebuild" ? "true" : "false");
        updateChips();
        applyGains();
      });
    });

    updateChips();
    return box;
  }

  // ---- size strip ----

  function buildSizeStrip(song) {
    var wrap = el("div", { cls: "size-strip" });
    wrap.appendChild(el("h3", { text: "Size, on a log scale" }));

    var wav = song.sizes.wav;
    var rows = [
      ["WAV", song.sizes.wav, 1, "bar-wav"],
      ["MP3", song.sizes.mp3, song.ratios.mp3, "bar-mp3"],
      [".sc", song.sizes.sc, song.ratios.sc, "bar-sc"],
      [".sc gz", song.sizes.sc_gz, song.ratios.sc_gz, "bar-scgz"],
    ];
    rows.forEach(function (r) {
      var name = r[0], bytes = r[1], ratio = r[2], cls = r[3];
      var row = el("div", { cls: "bar-row" });
      row.appendChild(el("span", { cls: "bar-name", text: name }));
      var track = el("div", { cls: "bar-track" });
      var pct = (Math.log10(bytes) / Math.log10(wav)) * 100;
      var fill = el("span", { cls: "bar-fill " + cls });
      fill.style.width = Math.max(pct, 2) + "%";
      track.appendChild(fill);
      track.appendChild(el("span", { cls: "bar-label", text: fmtKB(bytes) + " · ×" + ratio }));
      row.appendChild(track);
      wrap.appendChild(row);
    });
    return wrap;
  }

  // ---- borrowed audio line ----

  function buildBorrowed(song) {
    var kit = song.sizes.kit, voice = song.sizes.voice;
    if (kit === 0 && voice === 0) return null;
    var parts = [];
    if (kit > 0) parts.push("drum kit " + fmtKB(kit));
    if (voice > 0) parts.push("voice sample " + fmtKB(voice));
    var text = "Also borrowed from the recording: " + parts.join(", ") +
      " → ×" + song.ratios.with_borrowed + " overall";
    return el("div", { cls: "borrowed", text: text });
  }

  // ---- singer line ----

  function singerLabel(singer) {
    if (singer === "soulx") return "Sung by SoulX-Singer";
    if (singer === "diffsinger") return "Sung by DiffSinger + Seed-VC";
    return "Instrumental";
  }

  // ---- summary chips ----

  function buildChips(summary) {
    var wrap = el("div", { cls: "chips" });
    if (summary.tempo != null) {
      wrap.appendChild(el("span", { cls: "chip", text: summary.tempo + " BPM" }));
    }
    if (summary.instruments && summary.instruments.length) {
      wrap.appendChild(el("span", { cls: "chip", text: summary.instruments.join(", ") }));
    }
    wrap.appendChild(el("span", { cls: "chip", text: summary.words + " words" }));
    return wrap;
  }

  // ---- the code itself ----

  function buildCode(song) {
    var details = el("details", { cls: "code" });
    var summaryEl = el("summary", { text: "Show the sound code (" + fmtKB(song.sizes.sc) + ")" });
    details.appendChild(summaryEl);
    var pre = el("pre");
    details.appendChild(pre);
    var dl = el("a", { cls: "dl", text: "Download .sc", href: song.sc, attrs: { download: "" } });
    details.appendChild(dl);
    if (song.sizes.kit > 0) {
      details.appendChild(el("p", {
        cls: "files",
        text: "Drum kit (hits cut from the recording) not included; the code plays with a General MIDI kit without it"
      }));
    }
    fetch(song.sc)
      .then(function (r) {
        if (!r.ok) throw new Error(song.sc + ": " + r.status);
        return r.text();
      })
      .then(function (t) { pre.textContent = t; })
      .catch(function () { pre.textContent = "(could not load the code)"; });
    return details;
  }

  // ---- one card per song ----

  function buildCard(song) {
    var card = el("div", { cls: "card" });
    card.appendChild(el("h2", { text: song.title }));
    card.appendChild(el("p", { cls: "artist", text: song.artist }));
    card.appendChild(buildPlayers(song));
    card.appendChild(buildSizeStrip(song));
    var borrowed = buildBorrowed(song);
    if (borrowed) card.appendChild(borrowed);
    card.appendChild(el("p", { cls: "singer-line", text: singerLabel(song.singer) }));
    card.appendChild(buildChips(song.summary));
    card.appendChild(buildCode(song));
    return card;
  }

  // ---- footer ----

  function buildFooter(container, data) {
    container.textContent = "";
    var p1 = el("p");
    var creditLink = el("a", { text: data.credit, href: data.license_url, attrs: { target: "_blank", rel: "noopener" } });
    p1.appendChild(creditLink);
    p1.appendChild(document.createTextNode(" — these rebuilds are non-commercial derivatives shared under the same license."));
    container.appendChild(p1);

    container.appendChild(el("p", {
      text: "Private research project; rebuilds made with open models: audio-separator, tsumugi, torchcrepe, faster-whisper, GeneralUser GS, SoulX-Singer."
    }));

    container.appendChild(el("p", { text: "Built " + data.built + "." }));
  }

  // ---- boot ----

  function showStatus(text) {
    var status = document.getElementById("status");
    status.textContent = text;
    status.className = "show";
  }

  function renderPage(data) {
    buildTotals(document.getElementById("totals"), data.totals);
    var cards = document.getElementById("cards");
    cards.textContent = "";
    data.songs.forEach(function (song) {
      cards.appendChild(buildCard(song));
    });
    buildFooter(document.getElementById("footer"), data);
  }

  fetch('data.json')
    .then(function (r) {
      if (!r.ok) throw new Error("data.json: " + r.status);
      return r.json();
    })
    .then(renderPage)
    .catch(function (err) {
      if (location.protocol === "file:") {
        showStatus("Open this page through a web server: python -m http.server -d site");
      } else {
        showStatus("Could not load data.json (" + ((err && err.message) || err) + ")");
      }
    });
})();
</script>
</body>
</html>
