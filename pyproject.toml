[project]
name = "soundcode"
version = "0.3.0"
description = "Transcribe a song into readable code, then regenerate it"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Encoder stack. Pinned separately because it is large and CPU-bound on macOS.
# See docs/superpowers/specs/2026-07-31-soundcode-design.md §3.
encode = [
    "demucs>=4.1.0",
    "audio-separator[cpu]>=0.47",
    "basic-pitch>=0.4",
    "torchcrepe>=0.0.23",
    "whisperx>=3.1",
    "beat-this",
    "librosa>=0.10,<1.0",
    "tinysoundfont>=0.3.7",
    "cmudict",
    "resemblyzer",
    "setuptools<80",          # webrtcvad (resemblyzer) still imports pkg_resources
    "matplotlib",
    "pedalboard>=0.9",
]
# Benchmark scorer. See docs/superpowers/specs/2026-09-28-benchmark-scorer-design.md.
score = [
    # ==4.46.3, not >=: MERT's trust_remote_code Hubert subclass (HubertEncoder_extend)
    # breaks under transformers 5.x (encoder_outputs.hidden_states comes back None).
    # Seed-VC pins the same version for the same reason (scripts/install_seedvc.sh).
    "transformers==4.46.3",   # MERT (m-a-p/MERT-v1-95M) frame embeddings
    "nnAudio",                # MERT's remote code
]

[project.scripts]
soundcode = "soundcode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundcode"]
artifacts = ["src/soundcode/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
