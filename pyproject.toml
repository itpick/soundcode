[project]
name = "soundcode"
version = "0.3.0"
description = "Transcribe a song into readable code, then regenerate it"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Encoder stack. Pinned separately because it is large and CPU-bound on macOS.
# See docs/superpowers/specs/2026-07-31-soundcode-design.md §3.
encode = [
    "demucs>=4.1.0",
    "basic-pitch>=0.4",
    "torchcrepe>=0.0.23",
    "whisperx>=3.1",
    "beat-this",
    "librosa>=0.10",
]

[project.scripts]
soundcode = "soundcode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundcode"]
